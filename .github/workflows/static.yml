name: Publish Moment90 website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/static.yml, prepare-stadium-assets.mjs, apply-stadium-loading.py]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download and verify the approved demo build
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 420 --output moment90.zip 'https://drive.usercontent.google.com/download?id=1yn8ghUvVuiVwwRCLKsgQZPUPQqaUVkiP&export=download&confirm=t'
          echo 'bf8172af919b7316e25ddb47e9639b11605c49255aa53fd0c54c87408528f5d4  moment90.zip' | sha256sum --check
          unzip -q moment90.zip 'Moment90-20261119/index.html' 'Moment90-20261119/studio/*' -d staging
          mv staging/Moment90-20261119 public
          touch public/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/studio/contract.js')
          old = "export const PUBLIC_BASE = 'https://bnj-apl.github.io/goal-moment-3d/studio/';"
          text = p.read_text(encoding='utf-8')
          assert old in text
          p.write_text(text.replace(old, 'export const PUBLIC_BASE = import.meta.url.startsWith("https:") ? new URL("./", import.meta.url).href : "https://youngkermit8-coder.github.io/moment90-demo/studio/";'), encoding='utf-8')
          PY
          test -s public/index.html
          test -s public/studio/index.html
          test -s public/studio/bayern/muller-journey.html
      - name: Optimize stadium downloads
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund @gltf-transform/cli@4.5.1 meshoptimizer@1.2.0 sharp@0.35.5
          python3 apply-stadium-loading.py
          node prepare-stadium-assets.mjs public/studio
          test -s public/studio/models/stadium-web-v1.glb
          test -s public/studio/bayern/assets/allianz-interactive/allianz-web-v1.gltf
          node --test public/studio/tests/*.test.mjs
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
